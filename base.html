<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Loan Saathi{% endblock %}</title><style>
:root{--blue:#173f75;--cyan:#eaf3ff;--ink:#172033;--muted:#667085;--line:#dbe3ee}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--blue);color:white;padding:18px max(20px,calc((100% - 1080px)/2));display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}header a{color:white;text-decoration:none;margin-left:14px}main{max-width:900px;margin:34px auto;padding:0 18px}.brand{font-size:1.2rem;font-weight:800}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 8px 26px #183b6510;margin-bottom:20px}.narrow{max-width:640px;margin:0 auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:650;margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #b8c5d6;border-radius:9px;background:white;font:inherit}textarea{min-height:90px}button,.btn{display:inline-block;background:var(--blue);color:white;border:0;border-radius:9px;padding:12px 18px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;margin-top:14px}button.secondary,.btn.secondary{background:#e8eef7;color:var(--blue)}.muted{color:var(--muted);font-size:.92rem}.flash{padding:12px 14px;border-radius:9px;margin:12px 0;background:#fff0ef;color:#9c2822}.success{background:#eaf8ef;color:#17683a}.ref{font-size:1.35rem;font-weight:800;letter-spacing:.06em;background:var(--cyan);padding:14px;border-radius:10px;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f0f5fb}.tablewrap{overflow:auto}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#edf2fa;font-size:.85rem}footer{text-align:center;color:var(--muted);padding:25px;font-size:.9rem}.warning{border-left:4px solid #d59a27;padding:12px;background:#fff8e8}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:18px}main{margin:20px auto}header{padding:15px 18px}}
</style></head><body><header><a class="brand" href="/">Loan Saathi</a><nav><a href="/">Apply</a><a href="/status">Check status</a><a href="/admin/login">Admin</a></nav></header><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>Secure application portal · Applying does not guarantee loan approval.</footer></body></html>
